<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="optionsTitle">Enhanced Image Previewer Settings</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        max-width: 800px;
      }
      h1 {
        color: #333;
        border-bottom: 1px solid #eee;
        padding-bottom: 10px;
      }
      .section {
        margin-bottom: 20px;
        padding: 15px;
        background-color: #f9f9f9;
        border-radius: 5px;
      }
      .section h2 {
        margin-top: 0;
        font-size: 18px;
        color: #444;
      }
      label {
        display: block;
        margin-bottom: 10px;
      }
      input[type='color'],
      input[type='range'],
      input[type='number'] {
        margin-right: 10px;
        vertical-align: middle;
      }
      input[type='checkbox'] {
        margin-right: 8px;
      }
      .color-preview {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 1px solid #ccc;
        vertical-align: middle;
        margin-left: 10px;
      }
      .buttons {
        margin-top: 20px;
      }
      button {
        padding: 8px 16px;
        margin-right: 10px;
        background-color: #4285f4;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #3367d6;
      }
      button#reset {
        background-color: #f44336;
      }
      button#reset:hover {
        background-color: #d32f2f;
      }
      #status {
        margin-top: 15px;
        padding: 10px;
        border-radius: 4px;
      }
      .success {
        background-color: #d4edda;
        color: #155724;
      }
      .error {
        background-color: #f8d7da;
        color: #721c24;
      }
      .range-container {
        display: flex;
        align-items: center;
      }
      .range-container input[type='range'] {
        flex: 1;
        margin-right: 10px;
      }
      .range-value {
        min-width: 40px;
      }
    </style>
  </head>
  <body>
    <h1 data-i18n="optionsTitle">Enhanced Image Previewer Settings</h1>

    <div class="section">
      <h2 data-i18n="previewWindowSection">Preview window</h2>
      <label>
        <span data-i18n="backgroundColorLabel">Background color:</span>
        <input type="color" id="backgroundColor" />
        <span class="color-preview" id="colorPreview"></span>
      </label>

      <div class="range-container">
        <label for="backgroundOpacity" data-i18n="backgroundOpacityLabel"
          >Background opacity:</label
        >
        <input type="range" id="backgroundOpacity" min="0" max="1" step="0.1" />
        <span class="range-value" id="opacityValue">0.8</span>
      </div>
    </div>

    <div class="section">
      <h2 data-i18n="interactionSection">Interaction</h2>
      <label>
        <input type="checkbox" id="enableKeyboardShortcuts" />
        <span data-i18n="enableKeyboardShortcutsLongLabel">Enable keyboard shortcuts</span>
      </label>

      <label>
        <input type="checkbox" id="enableDoubleClickReset" />
        <span data-i18n="enableDoubleClickResetLabel">Enable double-click reset</span>
      </label>

      <label>
        <input type="checkbox" id="requireModifierKey" />
        <span data-i18n="requireModifierKeyLabel">Require Alt/Option-click to preview</span>
      </label>
    </div>

    <div class="section">
      <h2 data-i18n="triggerSection">Trigger and zoom</h2>
      <div class="range-container">
        <label for="minimumImageSize" data-i18n="minimumImageSizeLabel">Minimum image size:</label>
        <input type="range" id="minimumImageSize" min="16" max="256" step="1" />
        <span class="range-value" id="minimumImageSizeValue">64</span>
      </div>

      <div class="range-container">
        <label for="maxScale" data-i18n="maxScaleLabel">Maximum zoom:</label>
        <input type="range" id="maxScale" min="1" max="20" step="1" />
        <span class="range-value" id="maxScaleValue">10</span>
      </div>

      <div class="range-container">
        <label for="scaleSpeed" data-i18n="scaleSpeedLabel">Zoom speed:</label>
        <input type="range" id="scaleSpeed" min="1.01" max="1.5" step="0.01" />
        <span class="range-value" id="scaleSpeedValue">1.1</span>
      </div>
    </div>

    <div class="buttons">
      <button id="save" data-i18n="saveSettingsLabel">Save settings</button>
      <button id="reset" data-i18n="restoreDefaultsLabel">Restore defaults</button>
    </div>

    <div id="status" hidden></div>

    <script src="src/shared/core.js"></script>
    <script src="src/options/options.js"></script>
  </body>
</html>
