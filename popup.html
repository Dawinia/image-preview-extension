<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="extensionName">Enhanced Image Previewer</title>
    <style>
      body {
        width: 300px;
        padding: 15px;
        font-family: Arial, sans-serif;
      }
      .header {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
      }
      .header img {
        width: 32px;
        height: 32px;
        margin-right: 10px;
      }
      .header h1 {
        font-size: 18px;
        margin: 0;
      }
      .toggle-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .toggle {
        position: relative;
        display: inline-block;
        width: 50px;
        height: 24px;
      }
      .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        transition: 0.4s;
        border-radius: 24px;
      }
      .slider:before {
        position: absolute;
        content: '';
        height: 16px;
        width: 16px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        transition: 0.4s;
        border-radius: 50%;
      }
      input:checked + .slider {
        background-color: #2196f3;
      }
      input:checked + .slider:before {
        transform: translateX(26px);
      }
      .button {
        display: block;
        width: 100%;
        padding: 8px;
        margin-top: 15px;
        background-color: #4285f4;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
      }
      .button:hover {
        background-color: #3367d6;
      }
      .shortcuts {
        margin-top: 15px;
        font-size: 12px;
        color: #666;
      }
      .shortcuts p {
        margin: 5px 0;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <img
        src="icons/icon48.png"
        alt="Enhanced Image Previewer"
        data-i18n-attr="alt:extensionName"
      />
      <h1 data-i18n="extensionName">Enhanced Image Previewer</h1>
    </div>

    <div class="toggle-container">
      <span data-i18n="enablePreviewLabel">Enable image preview</span>
      <label class="toggle">
        <input type="checkbox" id="enablePreview" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-container">
      <span data-i18n="enableKeyboardShortcutsLabel">Enable keyboard shortcuts</span>
      <label class="toggle">
        <input type="checkbox" id="enableKeyboardShortcuts" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-container">
      <span data-i18n="enableDoubleClickResetLabel">Enable double-click reset</span>
      <label class="toggle">
        <input type="checkbox" id="enableDoubleClickReset" checked />
        <span class="slider"></span>
      </label>
    </div>

    <a href="#" id="openOptions" class="button" data-i18n="openOptionsLabel">Open options</a>

    <div class="shortcuts">
      <p><strong data-i18n="shortcutsTitle">Shortcuts:</strong></p>
      <p data-i18n="shortcutEsc">ESC: Close preview</p>
      <p data-i18n="shortcutZoom">+/-: Zoom in/out</p>
      <p data-i18n="shortcutReset">0: Reset image</p>
      <p data-i18n="shortcutMove">Arrow keys: Move image</p>
    </div>

    <script src="src/shared/core.js"></script>
    <script src="src/popup/popup.js"></script>
  </body>
</html>
