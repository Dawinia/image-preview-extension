name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          install-dependencies: true
      - run: npm ci
      - run: npm run check
      - run: npm run smoke
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
